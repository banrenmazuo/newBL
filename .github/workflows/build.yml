name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          CMDL="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$CMDL" ]; then
            CMDL="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $CMDL"
          yes | "$CMDL" --licenses > /dev/null 2>&1 || true
          yes | "$CMDL" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null 2>&1 || true

      - name: Grant execution permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: newBL-debug-apk
          path: app/build/outputs/apk/debug/*.apk
